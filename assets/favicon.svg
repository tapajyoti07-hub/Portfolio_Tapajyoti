<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background with subtle gradient border -->
  <rect width="32" height="32" rx="7" fill="#12122a" stroke="url(#borderGrad)" stroke-width="1.2" />
  <!-- TN Logo Monogram -->
  <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#tnGradient)" text-anchor="middle" letter-spacing="-0.5">TN</text>
</svg>
