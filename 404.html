<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Tapajyoti Nath</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Tapajyoti Nath's portfolio.">
  <meta name="theme-color" content="#0b0b16">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Devicon Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Scoped 404 Page Styling */
    :root {
      --bg-dark: #0b0b16;
      --bg-card: rgba(18, 18, 42, 0.75);
      --primary: #7C5CFF;
      --secondary: #00D4FF;
      --text-main: #f0f0f8;
      --text-muted: #9494ad;
      --border-color: rgba(255, 255, 255, 0.08);
      --gradient-brand: linear-gradient(135deg, #7C5CFF 0%, #00D4FF 100%);
      --radius-sm: 8px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
    }

    /* Ambient background glows */
    .glow-orb-1 {
      position: absolute;
      top: 20%;
      left: 30%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(124, 92, 255, 0.18) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }

    .glow-orb-2 {
      position: absolute;
      bottom: 20%;
      right: 30%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }

    /* Error Card Container */
    .error-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3.5rem 2.5rem;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .error-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: var(--gradient-brand);
    }

    /* 404 Large Gradient Text */
    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(6rem, 15vw, 9rem);
      font-weight: 900;
      line-height: 0.95;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -2px;
      text-shadow: 0 10px 30px rgba(124, 92, 255, 0.2);
    }

    /* Headings & Text */
    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.25rem;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Buttons */
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.8rem 1.75rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--gradient-brand);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 15px rgba(124, 92, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(124, 92, 255, 0.55);
      color: #ffffff;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      transform: translateY(-2px);
      color: #ffffff;
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 2.5rem 1.5rem;
      }
      .error-actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <main class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">
        <i class="fas fa-home"></i> Back to Home
      </a>
      <a href="index.html#projects" class="btn btn-outline">
        <i class="fas fa-folder-open"></i> View Projects
      </a>
    </div>
  </main>
</body>
</html>
